steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - apps/relay-gateway/Dockerfile
      - --tag
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}]

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/ardent-fastness-503107-i5/dharma-agent-fabric/relay:manual

timeout: 1200s
