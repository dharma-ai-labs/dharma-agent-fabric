name: Agent Fabric CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

permissions:
  contents: read

concurrency:
  group: agent-fabric-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows estimate: install 7m06s + validation 12m44s + overhead 43s = 20m33s.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce public content boundary
        env:
          DHARMA_PUBLIC_CONTENT_DENYLIST: ${{ secrets.DHARMA_PUBLIC_CONTENT_DENYLIST }}
        run: npm run public:content:check

      # Registered commands run inside bubblewrap on Linux. The usable proof runs on the image's
      # default user-namespace settings; this step only installs bubblewrap and reports them.
      - name: Prepare command sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          /usr/bin/bwrap --version
          echo "apparmor_restrict_unprivileged_userns=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"

      - name: Run package validation
        env:
          DHARMA_SANDBOX_EXPECT: ${{ runner.os == 'Linux' && 'usable' || '' }}
        run: npm run check

      # The same host with user namespaces turned off must refuse, and no command may run. The
      # AppArmor restriction alone does not stop bubblewrap on this image (measured in CI), so the
      # restricted host is made with user.max_user_namespaces=0 and restored afterwards.
      - name: Prove sandbox refusal on a restricted host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          original=$(cat /proc/sys/user/max_user_namespaces)
          sudo sysctl -w user.max_user_namespaces=0
          DHARMA_SANDBOX_EXPECT=refused node --test packages/task-runner/dist/registeredCommandSandbox.linux.test.js
          sudo sysctl -w user.max_user_namespaces="$original"

      - name: Verify CI budget and coverage
        run: node --test scripts/ci-budget.test.mjs

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build relay container
        if: runner.os == 'Linux'
        run: docker build --file apps/relay-gateway/Dockerfile --tag dharma-agent-fabric-relay:ci .

      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm sbom --workspaces --include-workspace-root --sbom-format cyclonedx > agent-fabric.cdx.json
          node -e "const fs=require('fs'); const bom=JSON.parse(fs.readFileSync('agent-fabric.cdx.json')); if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components)) process.exit(1)"
