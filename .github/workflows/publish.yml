name: Publish Agent Fabric

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      onboarding_only:
        description: Publish only contracts, secure-store, relay-client and CLI from reviewed main
        type: boolean
        default: false
      contracts_only:
        description: Publish only the exact reviewed recovery contracts package from main
        type: boolean
        default: false
      device_maintenance_only:
        description: Publish only the exact reviewed device-trust maintenance cohort from main
        type: boolean
        default: false
      expected_head:
        description: Exact reviewed main SHA (required for onboarding-only publication)
        type: string
        default: ""

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - name: Validate publication scope
        env:
          ONBOARDING_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.onboarding_only || false }}
          CONTRACTS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.contracts_only || false }}
          DEVICE_MAINTENANCE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.device_maintenance_only || false }}
          MAINTENANCE_PUBLISHER_SHA256: 4ac232f94c46eaee923df9ac44ad6ea33e2c6337e448c54bebb6f74076c83a8b
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          selected_scopes=0
          for selected in "$ONBOARDING_ONLY" "$CONTRACTS_ONLY" "$DEVICE_MAINTENANCE_ONLY"; do
            if [ "$selected" = "true" ]; then selected_scopes=$((selected_scopes + 1)); fi
          done
          if [ "$selected_scopes" -gt 1 ]; then
            echo "Choose exactly one bounded release scope." >&2
            exit 1
          fi
          if [ "$CONTRACTS_ONLY" = "true" ]; then
            node scripts/publish-recovery-contracts.mjs --expected-head "$EXPECTED_HEAD" --admission-only
          fi
          if [ "$DEVICE_MAINTENANCE_ONLY" = "true" ]; then
            printf '%s  %s\n' "$MAINTENANCE_PUBLISHER_SHA256" scripts/publish-device-maintenance.mjs | sha256sum --check --status
            node scripts/publish-device-maintenance.mjs --expected-head "$EXPECTED_HEAD" --admission-only
          fi
      - run: npm ci
      - run: npm run check
      - name: Build release artifacts
        if: "!(github.event_name == 'workflow_dispatch' && inputs.contracts_only)"
        run: |
          mkdir -p release
          npm pack --workspace packages/cli --pack-destination release
          npm pack --workspace packages/sdk --pack-destination release
          npm sbom --all --sbom-format cyclonedx > release/dharma-agent-fabric.cdx.json
          cp openapi/agent-fabric.openapi.json release/
          sha256sum release/* > release/SHA256SUMS
      - name: Attest release artifacts
        if: "!(github.event_name == 'workflow_dispatch' && inputs.contracts_only)"
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: release/*
      - name: Publish public workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ONBOARDING_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.onboarding_only || false }}
          CONTRACTS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.contracts_only || false }}
          DEVICE_MAINTENANCE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.device_maintenance_only || false }}
          MAINTENANCE_PUBLISHER_SHA256: 4ac232f94c46eaee923df9ac44ad6ea33e2c6337e448c54bebb6f74076c83a8b
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          selected_scopes=0
          for selected in "$ONBOARDING_ONLY" "$CONTRACTS_ONLY" "$DEVICE_MAINTENANCE_ONLY"; do
            if [ "$selected" = "true" ]; then selected_scopes=$((selected_scopes + 1)); fi
          done
          if [ "$selected_scopes" -gt 1 ]; then
            echo "Choose exactly one bounded release scope." >&2
            exit 1
          fi
          if [ "$CONTRACTS_ONLY" = "true" ]; then
            npm run publish:recovery-contracts -- --expected-head "$EXPECTED_HEAD" --publish
            exit 0
          fi
          if [ "$ONBOARDING_ONLY" = "true" ]; then
            npm run publish:onboarding -- --expected-head "$EXPECTED_HEAD"
            exit 0
          fi
          if [ "$DEVICE_MAINTENANCE_ONLY" = "true" ]; then
            printf '%s  %s\n' "$MAINTENANCE_PUBLISHER_SHA256" scripts/publish-device-maintenance.mjs | sha256sum --check --status
            npm run publish:device-maintenance -- --expected-head "$EXPECTED_HEAD" --publish
            exit 0
          fi

          package_exists() {
            local package="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if npm view "${package}" version >/dev/null 2>&1; then
                return 0
              fi
              sleep $((attempt * 2))
            done
            return 1
          }

          workspaces=(
            packages/contracts
            packages/secure-store
            packages/policy
            packages/provider-adapters
            packages/better-harness-bridge
            packages/evidence-reduction
            packages/relay-client
            packages/local-vault
            packages/task-runner
            packages/skill-manager
            packages/sdk
            packages/cli
          )
          for workspace in "${workspaces[@]}"
          do
            name=$(node -p "require('./${workspace}/package.json').name")
            version=$(node -p "require('./${workspace}/package.json').version")
            package="${name}@${version}"
            if package_exists "${package}"; then
              echo "${name}@${version} already exists; preserving immutable release."
            else
              dist_tag="latest"
              if [[ "${version}" == *-* ]]; then
                dist_tag="next"
              fi
              set +e
              publish_output=$(npm publish --workspace "${workspace}" --tag "${dist_tag}" 2>&1)
              publish_status=$?
              set -e
              if [ "${publish_status}" -eq 0 ]; then
                printf '%s\n' "${publish_output}"
              elif printf '%s' "${publish_output}" | grep -q 'previously published versions'; then
                echo "${package} became visible during publication; preserving immutable release."
              else
                printf '%s\n' "${publish_output}" >&2
                exit "${publish_status}"
              fi
            fi
          done
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
  publish-python:
    if: vars.PYPI_PUBLISH_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && (inputs.onboarding_only || inputs.contracts_only || inputs.device_maintenance_only))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: PYTHONPATH=sdks/python/src python -m unittest discover -s sdks/python/tests -v
      - run: python -m build sdks/python --outdir dist-python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist-python/
