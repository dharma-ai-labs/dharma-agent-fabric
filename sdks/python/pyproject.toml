[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dharma-agent-fabric-sdk"
version = "0.1.0"
description = "Organization-scoped Python SDK for Dharma Agent Fabric"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dharma AI Labs" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/dharma-ai-labs/dharma-agent-fabric"
Documentation = "https://hq.dharma-ai.io/api/v1/agent-fabric/openapi.json"

[tool.hatch.build.targets.wheel]
packages = ["src/dharma_agent_fabric"]
